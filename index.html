function botVote() {

// Get all player UIDs (sorted by join order)
function getAllUids(data) {
  return Object.keys(data.players || {});
}

// Get player role
function getRole(uid, gs) {
  const p = (gs.roleAssignments || {})[uid];
  return p || null;
}

// Get player's initial info (sees)
function getInfo(uid, gs) {
  return (gs.initialInfo || {})[uid] || null;
}

// Is player good? (including plain good)
function isGood(uid, gs) {
  const r = getRole(uid, gs);
  if (!r) return true; // plain good
  return ROLE_FACTION[r] === 'good';
}

// Known evils by this player (who they see as evil)
function seenEvils(uid, gs) {
  const info = getInfo(uid, gs);
  if (!info || info.seeType !== 'evil') return [];
  return info.sees || [];
}

// For Percival: merlin candidates (merlin + morgana)
function percivalCandidates(uid, gs) {
  const info = getInfo(uid, gs);
  if (!info || info.seeType !== 'merlin_candidates') return [];
  return info.sees || [];
}

// Build team proposal for a bot leader
function getBotTeamProposal(leaderUid, gs, allPlayers) {
  const assignments = gs.roleAssignments || {};
  const leaderRole = assignments[leaderUid];
  const teamSize = MISSION_CONFIG[Object.keys(gs.roleAssignments || {}).length || 5].sizes[(gs.mission || 1) - 1];

  const candidates = allPlayers.filter(p => p.uid !== leaderUid);
  let team = [];

  if (ROLE_FACTION[leaderRole] === 'evil') {
    // === EVIL LEADER ===
    // Priority: include evil teammates
    const evildoers = candidates.filter(p => {
      const r = assignments[p.uid];
      if (!r) return false;
      return ROLE_FACTION[r] === 'evil' && r !== 'oberon'; // Oberon is孤狼
    });
    team.push(...evildoers.map(p => p.uid));
    // Fill remaining with random (preferably players leader wants to manipulate)
    const remaining = candidates.filter(p => !team.includes(p.uid));
    while (team.length < teamSize && remaining.length > 0) {
      const idx = Math.floor(Math.random() * remaining.length);
      team.push(remaining.splice(idx, 1)[0].uid);
    }
  } else {
    // === GOOD LEADER ===
    const knownEvils = new Set();
    if (leaderRole === 'merlin') {
      // Merlin sees all evils (except mordred) — avoid them
      candidates.forEach(p => {
        const r = assignments[p.uid];
        if (r && ROLE_FACTION[r] === 'evil' && r !== 'mordred') knownEvils.add(p.uid);
      });
    }
    // Percival knows merlin candidates — can use this info
    // Plain good has no info

    // Prefer players not known to be evil
    let preferred = candidates.filter(p => !knownEvils.has(p.uid));
    // Shuffle to avoid predictable patterns
    preferred = shuffle(preferred.map(p => p.uid));
    team = preferred.slice(0, teamSize);

    // If not enough, fill with anyone
    if (team.length < teamSize) {
      const remaining = candidates.filter(p => !team.includes(p.uid));
      while (team.length < teamSize && remaining.length > 0) {
        const idx = Math.floor(Math.random() * remaining.length);
        team.push(remaining.splice(idx, 1)[0].uid);
      }
    }
  }
  return team.slice(0, teamSize);
}

// Determine bot vote on a proposed team
function getBotTeamVote(uid, gs, allPlayers) {
  const assignments = gs.roleAssignments || {};
  const myRole = assignments[uid];
  const team = (gs.currentTeam || {}).members || [];
  const myFaction = ROLE_FACTION[myRole] || 'good';

  if (myFaction === 'good') {
    // Good player: approve unless known evildoers are on the team
    const knownEvils = new Set();
    if (myRole === 'merlin') {
      allPlayers.forEach(p => {
        const r = assignments[p.uid];
        if (r && ROLE_FACTION[r] === 'evil' && r !== 'mordred') knownEvils.add(p.uid);
      });
    }
    const evilsOnTeam = team.filter(t => knownEvils.has(t));
    if (evilsOnTeam.length > 0) return 'reject';
    return 'approve';
  } else {
    // Evil player: approve if evil friends are on the team, else reject
    const myEvilTeammates = new Set();
    if (myRole !== 'oberon') {
      // Oberon doesn't know anyone
      allPlayers.forEach(p => {
        if (p.uid === uid) return;
        const r = assignments[p.uid];
        if (r && ROLE_FACTION[r] === 'evil' && r !== 'oberon') myEvilTeammates.add(p.uid);
      });
    }
    const evilsOnTeam = team.filter(t => myEvilTeammates.has(t));
    if (evilsOnTeam.length > 0) return 'approve';
    return 'reject';
  }
}

// Determine bot mission vote (success / fail)
function getBotMissionVote(uid, gs, allPlayers) {
  const assignments = gs.roleAssignments || {};
  const myRole = assignments[uid];
  const mission = gs.mission || 1;
  const myFaction = ROLE_FACTION[myRole] || 'good';

  if (myFaction === 'good') return 'success';

  // Evil logic
  if (myRole === 'oberon') {
    // Oberon:孤狼, behaves randomly — 30% fail
    return Math.random() < 0.3 ? 'fail' : 'success';
  }

  // Mordred: 30% fail (he can't be identified anyway)
  if (myRole === 'mordred') {
    return Math.random() < 0.3 ? 'fail' : 'success';
  }

  // Regular evil (assassin, morgana)
  // Strategy: fail only if it matters, avoid early exposure
  // Mission 1-2: mostly success to build trust
  if (mission <= 2) {
    return Math.random() < 0.15 ? 'fail' : 'success';
  }
  // Mission 3+: more willing to fail
  // But only fail if evil is not obvious
  const myEvilCount = allPlayers.filter(p => {
    const r = assignments[p.uid];
    return r && ROLE_FACTION[r] === 'evil' && r !== 'oberon';
  }).length;
  // If too many fails already given, might expose us — play safe
  const results = gs.missionResults || {};
  const failSoFar = Object.values(results).filter(r => !r.success).length;
  if (failSoFar >= 2) return 'success'; // don't give away more
  return Math.random() < 0.55 ? 'fail' : 'success';
}

// Assassin bot picks who to assassinate (returns targetUid or null)
function getAssassinationTarget(gs, allPlayers) {
  const assignments = gs.roleAssignments || {};
  // Find assassin
  const assassinUid = Object.keys(assignments).find(uid => assignments[uid] === 'assassin');
  if (!assassinUid) return null;

  // Assassin knows all evils (except oberon) — use that info
  // Try to identify Merlin
  const knownEvils = new Set();
  allPlayers.forEach(p => {
    const r = assignments[p.uid];
    if (r && ROLE_FACTION[r] === 'evil' && r !== 'oberon') knownEvils.add(p.uid);
  });

  // Find the player most likely to be Merlin
  // Merlin candidates: good players who are not known to be good by others
  // In a bot game, the "best" Merlin to assassinate is:
  // 1. A good player who is NOT a known evil (obviously)
  // 2. The most "central" good player (in bot logic, pick random good)

  const goods = allPlayers.filter(p => {
    const r = assignments[p.uid];
    if (!r) return true; // plain good
    return ROLE_FACTION[r] === 'good';
  });

  // Simple strategy: assassinate a random good player
  // Slightly better: prefer the one that looks like Merlin (played moderately)
  // In our bot game, we'll pick the plain good player or Percival's merlin candidates
  // Heuristic: prefer players with merlin_candidates info if Percival exists

  // Try to find Merlin
  let merlinUid = null;
  // Percival's view: if Percival is good, they see merlin candidates
  // We (as assassin) can look at initialInfo to see who saw what
  const percivalInfo = Object.values(gs.initialInfo || {}).find(i => i.seeType === 'merlin_candidates');
  if (percivalInfo && percivalInfo.sees && percivalInfo.sees.length > 0) {
    // Pick the candidate that Percival sees — likely one is Merlin, one is Morgana
    // Pick the one that is NOT known evil (Morgana is evil, Merlin is good)
    // Actually assassin already knows who's evil... so this doesn't help directly
  }

  // Best guess: pick a good player who is not obviously a plain good
  // Pick by: if there's a merlin, that player is most dangerous
  // In bot game: just pick the first good player that's not the assassin
  if (goods.length > 0) {
    merlinUid = goods[Math.floor(Math.random() * goods.length)].uid;
  }
  return merlinUid;
}

// Schedule bot leader auto-propose team
function scheduleBotPropose(leaderUid, gs) {
  const allPlayers = playersOrdered(state.roomData);
  const team = getBotTeamProposal(leaderUid, gs, allPlayers);
  if (team.length > 0) {
    setTimeout(() => {
      proposeTeam(team);
    }, 1000 + Math.random() * 1500);

// Schedule bot votes (voting or mission)
function scheduleBotVotes(phase) {
  const gs = state.roomData.gameState || {};
  const allPlayers = playersOrdered(state.roomData);
  const allUids = allPlayers.map(p => p.uid);

  allUids.forEach(uid => {
    const p = state.roomData.players[uid];
    if (!p || !p.isBot) return;
    if (uid === state.uid) return; // don't handle own uid

    if (phase === 'stage3') {
      const team = (gs.currentTeam || {}).members || [];
      const voted = (gs.currentVotes || {})[uid];
      if (!team.includes(uid) || voted) return;
      const vote = getBotTeamVote(uid, gs, allPlayers);
      const delay = 800 + Math.random() * 1500;
      setTimeout(() => {
        db.ref('rooms/' + state.roomCode + '/gameState/currentVotes/' + uid).set(vote);
      }, delay);
    } else if (phase === 'stage4') {
      const team = (gs.currentTeam || {}).members || [];
      const voted = (gs.missionVotes || {})[uid];
      if (!team.includes(uid) || voted) return;
      const vote = getBotMissionVote(uid, gs, allPlayers);
      const delay = 800 + Math.random() * 1500;
      setTimeout(() => {
        db.ref('rooms/' + state.roomCode + '/gameState/missionVotes/' + uid).set(vote);
      }, delay);
    }
  });
}

function generateRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded shadow-lg z-50 text-sm';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}
function playersOrdered(roomData) {
  if (!roomData || !roomData.players) return [];
  return Object.entries(roomData.players)
    .sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0))
    .map(([uid, p]) => ({ uid, ...p, isBot: !!p.isBot }));
}
function playerCount(roomData) {
  return roomData && roomData.players ? Object.keys(roomData.players).length : 0;
}

  if (!roomData || !roomData.gameState) return null;
  return roomData.gameState.leaderUid;
}

  return roomData.gameState.leaderUid === state.uid;
}

// ============================================================
// Role Assignment Logic
// ============================================================
function getSpecialRoles(config) {
  const roles = ['merlin', 'assassin'];
  if (config.roles.percival) roles.push('percival');
  if (config.roles.morgana) roles.push('morgana');
  if (config.roles.mordred) roles.push('mordred');
  if (config.roles.oberon) roles.push('oberon');
  return roles;
}
function assignRoles(playerUids, config) {
  const { good: goodCount, evil: evilCount } = FACTION_TABLE[playerUids.length];
  const special = getSpecialRoles(config);
  const goodSpecial = special.filter(r => ROLE_FACTION[r] === 'good');
  const evilSpecial = special.filter(r => ROLE_FACTION[r] === 'evil');
  while (goodSpecial.length < goodCount) goodSpecial.push('good');
  while (evilSpecial.length < evilCount) evilSpecial.push('evil');
  const shuffledGood = shuffle(goodSpecial).slice(0, goodCount);
  const shuffledEvil = shuffle(evilSpecial).slice(0, evilCount);
  const shuffledPlayers = shuffle(playerUids);
  const assignments = {};
  shuffledPlayers.forEach((uid, i) => {
    if (i < goodCount) assignments[uid] = shuffledGood[i];
    else assignments[uid] = shuffledEvil[i - goodCount];
  });
  return assignments;
}
function generateInitialInfo(assignments, playerUids) {
  const info = {};
  for (const uid of playerUids) {
    const myRole = assignments[uid];
    info[uid] = { sees: [], seeType: null };
    if (myRole === 'merlin') {
      for (const other of playerUids) {
        if (other === uid) continue;
        const or = assignments[other];
        if (or === 'mordred') continue;
        if (ROLE_FACTION[or] === 'evil') info[uid].sees.push(other);
      }
      info[uid].seeType = 'evil';
    } else if (myRole === 'percival') {
      for (const other of playerUids) {
        if (other === uid) continue;
        const or = assignments[other];
        if (or === 'merlin' || or === 'morgana') info[uid].sees.push(other);
      }
      info[uid].seeType = 'merlin_candidates';
    } else if (ROLE_FACTION[myRole] === 'evil' && myRole !== 'oberon') {
      for (const other of playerUids) {
        if (other === uid) continue;
        const or = assignments[other];
        if (or === 'oberon') continue;
        if (ROLE_FACTION[or] === 'evil') info[uid].sees.push(other);
      }
      info[uid].seeType = 'evil';
    }
  }
  return info;
}

// ============================================================
// Game Logic — State Transitions
// ============================================================
async function startGame() {
  const r = db.ref('rooms/' + state.roomCode);
  const playerUids = Object.keys(state.roomData.players);
  const assignments = assignRoles(playerUids, state.roomData.gameConfig);
  const initialInfo = generateInitialInfo(assignments, playerUids);
  // BOT 玩家直接 ack
  for (const uid of playerUids) {
    const p = state.roomData.players[uid];
    if (p && p.isBot) initialInfo[uid] = initialInfo[uid] || {};
    if (p && p.isBot) initialInfo[uid].ack = true;
  }
  const firstLeader = playerUids[0];
  const playerCount = playerUids.length;
  const ladyOn = !!state.roomData.gameConfig.roles.ladyOfLake;
  await r.update({
    'meta/phase': 'stage1',
    'meta/locked': true,
    'gameState/mission': 1,
    'gameState/rejections': 0,
    'gameState/leaderUid': firstLeader,
    'gameState/leaderHistory': [firstLeader],
    'gameState/roleAssignments': assignments,
    'gameState/initialInfo': initialInfo,
    'gameState/ladyHolderUid': ladyOn ? firstLeader : null,
    'gameState/ladyHistory': ladyOn ? [firstLeader] : [],
    'gameState/missionVotes': {},
    'gameState/currentTeam': null,
    'gameState/currentVotes': null,
    'gameState/assassinationTarget': null
  });
}
async function proposeTeam(memberUids) {
  const r = db.ref('rooms/' + state.roomCode);
  await r.update({
    'gameState/currentTeam': { members: memberUids, proposedAt: Date.now() },
    'gameState/currentVotes': null
  });
  await r.child('meta/phase').set('stage3');
}
async function castVote(vote) {
  const r = db.ref('rooms/' + state.roomCode + '/gameState/currentVotes/' + state.uid);
  await r.set(vote);
}
async function submitTeam() {
  // currentTeam already set, just move to stage3
  const r = db.ref('rooms/' + state.roomCode);
  await r.child('meta/phase').set('stage3');
  await r.child('gameState/currentVotes').set(null);
}
async function finishVoting() {
  const r = db.ref('rooms/' + state.roomCode);
  const snap = await r.child('gameState/currentVotes').once('value');
  const votes = snap.val() || {};
  const approve = Object.values(votes).filter(v => v === 'approve').length;
  const reject = Object.values(votes).filter(v => v === 'reject').length;
  const team = state.roomData.gameState.currentTeam.members;

  if (reject >= approve) {
    // 否決
    const newRej = (state.roomData.gameState.rejections || 0) + 1;
    if (newRej >= 5) {
      await r.update({
        'gameState/rejections': newRej,
        'meta/phase': 'over',
        'meta/winner': 'evil',
        'meta/winReason': 'rejections_5'
      });
      return;
    }
    // 換下一位隊長
    const players = playersOrdered(state.roomData);
    const idx = players.findIndex(p => p.uid === state.roomData.gameState.leaderUid);
    const nextIdx = (idx + 1) % players.length;
    const newLeader = players[nextIdx].uid;
    const newHist = [...(state.roomData.gameState.leaderHistory || []), newLeader];
    await r.update({
      'gameState/rejections': newRej,
      'gameState/leaderUid': newLeader,
      'gameState/leaderHistory': newHist,
      'gameState/currentTeam': null,
      'gameState/currentVotes': null,
      'meta/phase': 'stage2'
    });
  } else {
    // 通過，進任務
    await r.update({
      'gameState/rejections': 0,
      'meta/phase': 'stage4',
      'gameState/missionVotes': {}
    });
  }
}
async function castMissionVote(success) {
  const r = db.ref('rooms/' + state.roomCode + '/gameState/missionVotes/' + state.uid);
  await r.set(success ? 'success' : 'fail');
}
async function finishMission() {
  const r = db.ref('rooms/' + state.roomCode);
  const gs = state.roomData.gameState;
  const mission = gs.mission;
  const playerCount = Object.keys(state.roomData.players).length;
  const team = gs.currentTeam.members;
  const snap = await r.child('gameState/missionVotes').once('value');
  const votes = snap.val() || {};
  const successCount = Object.values(votes).filter(v => v === 'success').length;
  const failCount = Object.values(votes).filter(v => v === 'fail').length;

  // 第 4 關雙失敗票
  let actualFail = failCount;
  const doubleFail = MISSION_CONFIG[playerCount].doubleFailMission === mission;
  if (doubleFail && failCount >= 2) actualFail = 2;
  if (doubleFail && failCount === 1) actualFail = 0;  // 1 票不算失敗
  const isSuccess = actualFail === 0;

  const results = state.roomData.gameState.missionResults || {};
  results[mission] = { success: successCount, fail: failCount, voters: team };
  await r.child('gameState/missionResults').set(results);

  // 累積勝場
  let goodWin = 0, evilWin = 0;
  for (let i = 1; i <= mission; i++) {
    if (results[i] && MISSION_CONFIG[playerCount].doubleFailMission === i) {
      // 雙失敗票
      evilWin += (results[i].fail >= 2) ? 1 : 0;
      goodWin += (results[i].fail < 2) ? 1 : 0;
    } else {
      evilWin += (results[i] && results[i].fail > 0) ? 1 : 0;
      goodWin += (results[i] && results[i].fail === 0) ? 1 : 0;
    }
  }

  if (evilWin >= 3) {
    await r.update({ 'meta/phase': 'over', 'meta/winner': 'evil', 'meta/winReason': 'missions_3_evil' });
    return;
  }
  if (goodWin >= 3) {
    await r.update({ 'meta/phase': 'stage6', 'meta/winner': null });
    return;
  }
  // 觸發女神？
  const ladyOn = state.roomData.gameConfig.roles.ladyOfLake;
  if (ladyOn && [2, 3, 4].includes(mission)) {
    await r.update({ 'meta/phase': 'stage5' });
    return;
  }
  // 換隊長，進下一關
  await nextMissionOrLeader();
}
async function nextMissionOrLeader() {
  const r = db.ref('rooms/' + state.roomCode);
  const gs = state.roomData.gameState;
  const players = playersOrdered(state.roomData);
  // 第 5 關或中間換隊長
  if (gs.mission >= 5) {
    // 理論上不會到這（5 關會贏）
    return;
  }
  const idx = players.findIndex(p => p.uid === gs.leaderUid);
  const nextIdx = (idx + 1) % players.length;
  const newLeader = players[nextIdx].uid;
  const newHist = [...(gs.leaderHistory || []), newLeader];
  await r.update({
    'gameState/mission': gs.mission + 1,
    'gameState/leaderUid': newLeader,
    'gameState/leaderHistory': newHist,
    'gameState/currentTeam': null,
    'gameState/currentVotes': null,
    'meta/phase': 'stage2'
  });
}
async function checkLady(targetUid) {
  const r = db.ref('rooms/' + state.roomCode);
  const gs = state.roomData.gameState;
  const targetRole = gs.roleAssignments[targetUid];
  const targetFaction = ROLE_FACTION[targetRole];

  // 寫入女神持有者的查驗結果（只本人看得到，後面 stage5 顯示）
  const info = gs.initialInfo || {};
  info[gs.ladyHolderUid] = { sees: [targetUid], seeType: 'alignment', result: targetFaction };

  // 女神標記轉移
  const newHist = [...(gs.ladyHistory || []), targetUid];

  await r.update({
    'gameState/initialInfo': info,
    'gameState/ladyHolderUid': targetUid,
    'gameState/ladyHistory': newHist
  });

  // 換隊長、進下一關
  const players = playersOrdered(state.roomData);
  const idx = players.findIndex(p => p.uid === gs.leaderUid);
  const nextIdx = (idx + 1) % players.length;
  const newLeader = players[nextIdx].uid;
  const newHist2 = [...(gs.leaderHistory || []), newLeader];
  await r.update({
    'gameState/leaderUid': newLeader,
    'gameState/leaderHistory': newHist2,
    'gameState/currentTeam': null,
    'gameState/currentVotes': null,
    'meta/phase': 'stage2'
  });
}
async function assassinate(targetUid) {
  const r = db.ref('rooms/' + state.roomCode);
  const targetRole = state.roomData.gameState.roleAssignments[targetUid];
  const hit = targetRole === 'merlin';
  await r.update({

function renderHeader() {
  const phase = state.roomData && state.roomData.meta && state.roomData.meta.phase;
  if (!phase || !['stage1','stage2','stage3','stage4','stage5','stage6','over'].includes(phase)) return '';
  const gs = state.roomData.gameState || {};
  const playerCount = Object.keys(state.roomData.players).length;
  const sizes = MISSION_CONFIG[playerCount].sizes;
  const mission = gs.mission || 1;
  const results = gs.missionResults || {};
  const rejections = gs.rejections || 0;

  let circles = '';
  for (let i = 1; i <= 5; i++) {
    const r = results[i];
    let cls = 'w-8 h-8 rounded-full border-2 flex items-center justify-center text-xs font-bold ';
    let label = '';
    if (r) {
      if (r.fail > 0) {
        cls += 'bg-rose-500 border-rose-600 text-white';
        label = '✗' + r.fail;
      } else {
        cls += 'bg-sky-500 border-sky-600 text-white';
        label = '✓' + r.success;
      }
    } else if (i === mission) {
      cls += 'border-amber-400 text-amber-600 pulse';
      label = sizes[i-1];
    } else if (i < mission) {
      cls += 'border-slate-300 text-slate-400';
      label = sizes[i-1];
    } else {
      cls += 'border-slate-300 text-slate-500';
      label = sizes[i-1];
    }
    circles += `<div class="${cls}">${label}</div>`;
  }

  const rejColor = rejections >= 4 ? 'text-rose-600 font-bold' : 'text-slate-600';

  return `
    <div class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-3 py-2 flex items-center justify-between">
      <div class="flex items-center gap-1">${circles}</div>

      <button onclick="openRoleModal()" class="px-3 py-1 bg-slate-100 rounded-lg text-sm font-medium">📖</button>
    </div>
  `;
}

// 計算已選角色的好人/壞人數（梅林刺客固定算進去）
function countRoles(selectedRoles) {
  let good = 0, evil = 0;
  // 梅林刺客永遠算
  good += 1; // merlin
  evil += 1; // assassin
  for (const r of selectedRoles) {
    if (r === 'percival' || r === 'ladyOfLake') good++;
    else if (r === 'morgana' || r === 'mordred' || r === 'oberon') evil++;
  }
  return { good, evil };
}

function getSelectedRoles(roles) {
  const out = [];
  if (roles.percival) out.push('percival');
  if (roles.morgana) out.push('morgana');
  if (roles.mordred) out.push('mordred');
  if (roles.oberon) out.push('oberon');
  if (roles.ladyOfLake) out.push('ladyOfLake');
  return out;
}

function isRoleSelectionValid(roles, playerCount) {
  // 5人派西維爾規則：要有莫德雷德或莫甘娜
  if (playerCount === 5 && roles.percival && !roles.morgana && !roles.mordred) return false;
  // 湖中女神 8+ 人才能用
  if (roles.ladyOfLake && playerCount <= 7) return false;
  return true;
}

function getRoleHintMessage(roles, playerCount) {
  const msgs = [];
  // 5人派西維爾規則
  if (playerCount === 5 && roles.percival && !roles.morgana && !roles.mordred) {
    msgs.push('💡 五人局：選了派西維爾，需再選莫甘娜或莫德雷德');
  }

  // 湖中女神
  if (roles.ladyOfLake && playerCount <= 7) {
    msgs.push('💡 湖中女神需 8 人以上');
  }
  // 奧伯倫警告
  if (roles.oberon) msgs.push('⚠️ 奧伯倫對正義方有利，慎用');
  return msgs.join(' · ');
}

function renderOverBody() {
  const winner = state.roomData.meta.winner;
  const reason = state.roomData.meta.winReason;
  const gs = state.roomData.gameState || {};
  const assignments = gs.roleAssignments || {};
  const assassinUid = Object.keys(assignments).find(uid => assignments[uid] === 'assassin');
  const merlinUid = Object.keys(assignments).find(uid => assignments[uid] === 'merlin');
  const targetUid = gs.assassinationTarget;

  let title = '';
  let titleColor = '';
  if (winner === 'good') {
    title = '🔵 正義陣營獲勝！';
    titleColor = 'text-sky-700';
  } else {
    title = '🔴 邪惡陣營獲勝！';
    titleColor = 'text-rose-700';
  }

  let reasonText = '';
  if (reason === 'missions_3_evil') reasonText = '壞人完成 3 次任務破壞';
  else if (reason === 'rejections_5') reasonText = '連續 5 次否決';
  else if (reason === 'assassin_hit') reasonText = '刺客刺中梅林';
  else if (reason === 'assassin_miss') reasonText = '刺客刺錯人';

  const revealHtml = playersOrdered(state.roomData).map(p => {
    const r = assignments[p.uid] || 'good';
    const info = ROLE_INFO[r];
    return `
      <div class="flex items-center justify-between py-2 px-3 ${info.faction === 'good' ? 'bg-sky-50' : 'bg-rose-50'} rounded-lg">
        <div class="flex items-center gap-2">
          ${p.isHost ? '<span class="text-amber-500">⭐</span>' : '<span class="w-4"></span>'}
          <span class="font-medium">${esc(p.nickname)}</span>
        </div>
        <div class="text-sm">
          <span class="${info.faction === 'good' ? 'text-sky-700' : 'text-rose-700'} font-bold">${esc(info.name)}</span>
          <span class="text-xs text-slate-500 ml-1">${info.faction === 'good' ? '🔵' : '🔴'}</span>
        </div>
      </div>
    `;
  }).join('');

  let extra = '';
  if (reason === 'assassin_hit' || reason === 'assassin_miss') {
    const targetP = state.roomData.players[targetUid];
    const merlinP = state.roomData.players[merlinUid];
    extra = `<div class="bg-slate-50 rounded-xl p-3 text-sm">
      刺客選擇：<span class="font-bold">${esc(targetP ? targetP.nickname : '?')}</span><br>
      真正的梅林：<span class="font-bold">${esc(merlinP ? merlinP.nickname : '?')}</span>
    </div>`;
  }

  return `
    <div class="space-y-4">
      <div class="bg-white border-2 ${winner === 'good' ? 'border-sky-300' : 'border-rose-300'} rounded-2xl p-6 text-center">
        <div class="text-3xl font-bold ${titleColor}">${title}</div>
        <div class="text-sm text-slate-600 mt-2">${reasonText}</div>
      </div>
      ${extra}
      <div>
        <div class="text-sm font-medium text-slate-700 mb-2">真實身份</div>
        <div class="space-y-1">${revealHtml}</div>
      </div>
      ${state.isHost ? `<button onclick="backToLobby()" class="w-full bg-indigo-600 text-white py-4 rounded-xl text-lg font-bold active:scale-95">返回房間（重玩）</button>` : '<div class="text-center text-slate-500 text-sm py-4">等待房主重玩...</div>'}
    </div>
  `;
}

// Role Modal
// ============================================================
function openRoleModal() {
  state.roleModalOpen = true;
  renderRoleModal();
}
function closeRoleModal() {
  state.roleModalOpen = false;
  state.roleCardRevealed = false;
  if (state.pressTimer) clearTimeout(state.pressTimer);
  document.getElementById('modal-root').innerHTML = '';
}
function renderRoleModal() {
  const modal = document.getElementById('modal-root');
  if (!state.roleModalOpen) { modal.innerHTML = ''; return; }
  const phase = state.roomData && state.roomData.meta && state.roomData.meta.phase;
  if (!phase || !['stage1','stage2','stage3','stage4','stage5','stage6','over'].includes(phase)) {
    state.roleModalOpen = false;
    return;
  }
  const gs = state.roomData.gameState || {};
  const myRole = (gs.roleAssignments || {})[state.uid];
  const roleInfo = ROLE_INFO[myRole] || ROLE_INFO.good;
  const factionColor = roleInfo.faction === 'good' ? 'sky' : 'rose';
  const allRoles = ['merlin', 'percival', 'assassin', 'morgana', 'mordred', 'oberon'];
  const cfg = state.roomData.gameConfig || { roles: {} };
  // 收集本局所有角色（包含湊數用的 plain good/evil）
  const cfgRoles = cfg.roles || {};
  const { good: cfgGood, evil: cfgEvil } = FACTION_TABLE[Object.keys(state.roomData.players).length] || FACTION_TABLE[5];
  const assigned = {};
  assigned.merlin = true;
  assigned.assassin = true;
  if (cfgRoles.percival) { assigned.percival = true; assigned.morgana = true; }
  if (cfgRoles.mordred) assigned.mordred = true;
  if (cfgRoles.oberon) assigned.oberon = true;
  if (cfgRoles.ladyOfLake) assigned.ladyOfLake = true;

  // 統計已有名單，算出還需補幾個 plain good/evil
  const specRoles = Object.keys(assigned);
  const goodSpec = specRoles.filter(r => ROLE_FACTION[r] === 'good').length;
  const evilSpec = specRoles.filter(r => ROLE_FACTION[r] === 'evil').length;
  const plainGood = cfgGood - goodSpec;
  const plainEvil = cfgEvil - evilSpec;

  const allRolesList = [...specRoles];
  for (let i = 0; i < plainGood; i++) allRolesList.push('good');
  for (let i = 0; i < plainEvil; i++) allRolesList.push('evil');

  const roleListHtml = allRolesList.map(r => {
    const info = ROLE_INFO[r];
    const c = info.faction === 'good' ? 'sky' : 'rose';
    const factionLabel = info.faction === 'good' ? '正' : '邪';
    const factionBg = info.faction === 'good' ? 'bg-sky-100 text-sky-700' : 'bg-rose-100 text-rose-700';
    return `
      <div class="border-2 border-slate-200 rounded-xl p-3">
        <div class="flex items-center justify-between">
          <div>
            <div class="font-bold">${esc(info.name)}</div>
            <div class="text-xs ${factionBg} font-bold px-2 py-0.5 rounded mt-1 inline-block">${factionLabel} · ${info.faction === 'good' ? '正義' : '邪惡'}</div>
          </div>
        </div>
        <div class="text-sm text-slate-600 mt-2">${info.desc}</div>
      </div>
    `;
  }).join('');

  modal.innerHTML = `
    <div class="fixed inset-0 z-50 modal-bg flex items-end sm:items-center justify-center" onclick="if(event.target===this)closeRoleModal()">
      <div class="bg-white w-full max-w-md max-h-[90vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl hide-scroll">
        <div class="sticky top-0 bg-white border-b p-4 flex items-center justify-between">
          <div class="font-bold">📖 我的角色與規則</div>
          <button onclick="closeRoleModal()" class="text-slate-500">✕</button>
        </div>
        <div class="p-4 space-y-4">
          <div>
            <div class="text-xs text-slate-500 mb-2">你的角色（按住顯示）</div>
            <div class="press-hold" onmousedown="startPress()" ontouchstart="startPress()" onmouseup="endPress()" onmouseleave="endPress()" ontouchend="endPress()">
              <div class="border-4 border-${state.roleCardRevealed ? factionColor + '-400' : 'slate-300'} rounded-2xl p-6 text-center transition-colors">
                ${state.roleCardRevealed ? `
                  <div class="text-3xl font-bold text-${factionColor}-700">${esc(roleInfo.name)}</div>
                  <div class="text-sm text-${factionColor}-600 mt-1">${roleInfo.faction === 'good' ? '正義陣營' : '邪惡陣營'}</div>
                ` : `
                  <div class="text-slate-400 text-2xl">🂠</div>
                  <div class="text-xs text-slate-400 mt-1">按住 0.5 秒</div>
                `}
              </div>
            </div>
          </div>
          <div>
            <div class="text-xs text-slate-500 mb-2">本局登場角色</div>
            <div class="space-y-2">${roleListHtml}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}
function startPress() {
  if (state.pressTimer) clearTimeout(state.pressTimer);
  state.pressTimer = setTimeout(() => {
    state.roleCardRevealed = true;
    renderRoleModal();
  }, 500);
}
function endPress() {
  if (state.pressTimer) clearTimeout(state.pressTimer);
  if (state.roleCardRevealed) {
    setTimeout(() => {
      state.roleCardRevealed = false;
      renderRoleModal();
    }, 500);
  }
}

// ============================================================
// Actions
// ============================================================
async function goLanding() { state.view = 'landing'; state.errorMsg = ''; render(); }
function goCreate() { state.view = 'create'; state.errorMsg = ''; render(); }
function goJoin() { state.view = 'join'; state.errorMsg = ''; render(); }

async function doCreate() {
  const nick = document.getElementById('create-nick').value.trim();
  const pwd = document.getElementById('create-pwd').value;
  if (!nick) { state.errorMsg = '請輸入暱稱'; render(); return; }
  if (pwd.length < 4) { state.errorMsg = '密碼至少 4 字'; render(); return; }
  try {
    // 強迫拿新的匿名 UID，避免同瀏覽器 session 覆寫
    await auth.signOut();
    const cred = await auth.signInAnonymously();
    const uid = cred.user.uid;
    state.uid = uid;

    const code = generateRoomCode();
    const pwdHash = await sha256(pwd);
    const r = db.ref('rooms/' + code);
    await r.set({
      meta: { hostUid: uid, createdAt: Date.now(), phase: 'lobby', locked: false, maxPlayers: 10 },
      hostPassword: pwdHash,
      players: {
        [uid]: { nickname: nick, isHost: true, online: true, joinedAt: Date.now() }
      }
    });
    state.roomCode = code;
    state.isHost = true;
    state.myData = { nickname: nick, isHost: true };
    state.view = 'room';
    attachRoomListener();
    render();
  } catch (e) {
    state.errorMsg = '創建失敗：' + e.message;
    render();
  }
}

async function doJoin() {
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  const nick = document.getElementById('join-nick').value.trim();
  const pwd = document.getElementById('join-pwd').value;
  if (!code || !nick || !pwd) { state.errorMsg = '請填寫所有欄位'; render(); return; }
  try {
    // 強迫拿新的匿名 UID，避免同瀏覽器 session 覆寫
    await auth.signOut();
    const cred = await auth.signInAnonymously();
    const uid = cred.user.uid;
    state.uid = uid;

    const r = db.ref('rooms/' + code);
    const snap = await r.once('value');
    if (!snap.exists()) { state.errorMsg = '房間不存在'; render(); return; }
    const data = snap.val();
    if (data.meta && data.meta.locked) { state.errorMsg = '遊戲已開始，無法加入'; render(); return; }
    const pwdHash = await sha256(pwd);
    if (data.hostPassword !== pwdHash) { state.errorMsg = '房東密碼錯誤'; render(); return; }
    await r.child('players/' + uid).set({ nickname: nick, isHost: false, online: true, joinedAt: Date.now() });
    state.roomCode = code;
    state.isHost = false;
    state.myData = { nickname: nick, isHost: false };
    state.view = 'room';
    attachRoomListener();
    render();
  } catch (e) {
    state.errorMsg = '加入失敗：' + e.message;
    render();
  }
}

async function doStart() {
  // 進 roleConfig
  await db.ref('rooms/' + state.roomCode + '/meta/phase').set('roleConfig');
}

function handleRoleBtnClick(el) {
  const role = el.dataset.role;
  if (!role) return;
  const current = state.roomData?.gameConfig?.roles || {};
  const on = !current[role];
  toggleRole(role, on);
}

function toggleRole(role, on) {
  const r = db.ref('rooms/' + state.roomCode + '/gameConfig/roles');
  const playerCount = Object.keys(state.roomData.players).length;
  const current = state.roomData.gameConfig?.roles || {};
  const update = {};

  if (role === 'percival') {
    update.percival = on;
    if (on) update.morgana = true; // 連動莫甘娜
    else update.morgana = false;
  } else if (role === 'morgana') {
    update.morgana = on;
    if (on) { update.percival = true; } // 連動派西維爾
    else update.percival = false;
  } else if (role === 'ladyOfLake') {
    // 8人以上才能用
    if (!on || playerCount >= 8) update.ladyOfLake = on;
  } else if (role === 'oberon') {
    update.oberon = on;
  } else if (role === 'mordred') {
    update.mordred = on;
  }
  r.update(update);
}

async function doConfirmRoles() {
  const playerCount = Object.keys(state.roomData.players).length;
  const roles = state.roomData.gameConfig?.roles || {};
  if (!isRoleSelectionValid(roles, playerCount)) {
    toast('角色人數不符合，請調整後再試');
    return;
  }
  const r = db.ref('rooms/' + state.roomCode);
  await r.child('gameConfig/playerCount').set(playerCount);
  await r.child('gameConfig/roles/merlin').set(true);
  await r.child('gameConfig/roles/assassin').set(true);
  // 進 stage1
  await startGame();
}

async function ackRole() {
  const r = db.ref('rooms/' + state.roomCode + '/gameState/initialInfo/' + state.uid + '/ack');
  await r.set(true);
  // 檢查是否全員都 ack
  const allUids = Object.keys(state.roomData.players);
  const info = state.roomData.gameState.initialInfo || {};
  const allAck = allUids.every(uid => info[uid] && info[uid].ack);
  if (allAck) {
    await db.ref('rooms/' + state.roomCode + '/meta/phase').set('stage2');
    // 順便清掉 currentTeam
    await db.ref('rooms/' + state.roomCode + '/gameState/currentTeam').set(null);
  }
}

function toggleTeamMember(uid) {
  const gs = state.roomData.gameState;
  const team = (gs.currentTeam && gs.currentTeam.members) || [];
  const playerCount = Object.keys(state.roomData.players).length;
  const sizes = MISSION_CONFIG[playerCount].sizes;
  const teamSize = sizes[(gs.mission || 1) - 1];
  let newTeam;
  if (team.includes(uid)) {
    newTeam = team.filter(u => u !== uid);
  } else {
    if (team.length >= teamSize) {
      toast('已達人數上限');
      return;
    }
    newTeam = [...team, uid];
  }
  db.ref('rooms/' + state.roomCode + '/gameState/currentTeam').set({ members: newTeam, proposedAt: Date.now() });
}

async function submitTeam() {
  const gs = state.roomData.gameState;
  const team = (gs.currentTeam && gs.currentTeam.members) || [];
  await proposeTeam(team);
}

function leaveRoom() {
  if (state.roomCode) {
    db.ref('rooms/' + state.roomCode + '/players/' + state.uid + '/online').set(false);
    detachRoomListener();
  }
  state.roomCode = null;
  state.roomData = null;
  state.isHost = false;
  state.view = 'landing';
  render();
}
async function addBotPlayer() {
  if (!state.isHost) return;
  const count = Object.keys(state.roomData.players).length;
  if (count >= 10) { toast('已達人數上限 10 人'); return; }
  const nick = getBotNickname();
  const uid = 'bot_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  await db.ref('rooms/' + state.roomCode + '/players/' + uid).set({
    nickname: nick,
    isHost: false,
    online: true,
    isBot: true,
    joinedAt: Date.now()
  });
}
async function removeBot(uid) {
  if (!state.isHost) return;
  const p = state.roomData && state.roomData.players && state.roomData.players[uid];
  if (!p || !p.isBot) return;
  await db.ref('rooms/' + state.roomCode + '/players/' + uid).remove();
  if (BOT_NICKNAMES_USED.has(p.nickname)) BOT_NICKNAMES_USED.delete(p.nickname);
}
async function createDisconnectBot(oldUid) {
  const count = Object.keys(state.roomData.players).length;
  if (count >= 10) return;
  const oldPlayer = state.roomData.players[oldUid];
  if (!oldPlayer || oldPlayer.isBot) return; // 已是 BOT 或已不存在
  const nick = getBotNickname();
  const uid = 'bot_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  const gs = state.roomData.gameState;
  const botVoteRole = (gs && gs.roleAssignments) ? gs.roleAssignments[oldUid] : null;
  await db.ref('rooms/' + state.roomCode + '/players/' + uid).set({
    nickname: nick,
    isHost: false,
    online: true,
    isBot: true,
    botVoteRole: botVoteRole,
    joinedAt: Date.now()
  });
  // 如果該玩家在 currentTeam，更新成 BOT UID
  if (gs && gs.currentTeam && gs.currentTeam.members && gs.currentTeam.members.includes(oldUid)) {
    const members = gs.currentTeam.members.map(m => m === oldUid ? uid : m);
    await db.ref('rooms/' + state.roomCode + '/gameState/currentTeam/members').set(members);
  }
  // 如果該玩家是 leader，更新 leader
  if (gs && gs.leaderUid === oldUid) {
    await db.ref('rooms/' + state.roomCode + '/gameState/leaderUid').set(uid);
  }
}

// ============================================================
// Firebase Listeners
// ============================================================
let roomRef = null;
let botVoteTimers = {}; // uid -> timeout id
function clearBotVoteTimers() { Object.values(botVoteTimers).forEach(t => clearTimeout(t)); botVoteTimers = {}; }

function attachRoomListener() {
  if (roomRef) roomRef.off();
  roomRef = db.ref('rooms/' + state.roomCode);
  roomRef.on('value', snap => {
    const data = snap.val();
    if (!data) {
      toast('房間已被刪除');
      leaveRoom();
      return;
    }

    // 斷線檢測：如果任何人（包括自己）斷線了，在遊戲中自動建立 BOT 接手
    if (data.meta && data.meta.phase && ['stage1','stage2','stage3','stage4','stage5','stage6'].includes(data.meta.phase)) {
      const players = data.players || {};
      for (const [uid, p] of Object.entries(players)) {
        if (p.online === false && !p.isBot) {
          // 玩家斷線且還沒變成 BOT，建立 BOT 接手
          createDisconnectBot(uid);
        }
      }
    }

    state.roomData = data;
    if (data.meta && data.meta.phase && ['stage1','stage2','stage3','stage4','stage5','stage6','over'].includes(data.meta.phase)) {
      state.view = 'room';
    } else if (data.meta && data.meta.phase === 'roleConfig') {
      state.view = 'room';
    } else if (data.meta && data.meta.phase === 'lobby') {
      state.view = 'room';
    }
    if (state.roleModalOpen) renderRoleModal();
    else render();
    // 觸發 BOT 自動動作
    clearBotVoteTimers();
    const gs2 = data.gameState || {};
    // Stage2: bot leader auto-proposes team
    if (data.meta && data.meta.phase === 'stage2') {
      const leaderUid = gs2.leaderUid;
      if (leaderUid && data.players && data.players[leaderUid] && data.players[leaderUid].isBot) {
        scheduleBotPropose(leaderUid, gs2);
      }
    }
    // Stage3: auto-finish when all team members voted
    if (data.meta && data.meta.phase === 'stage3') {
      scheduleBotVotes('stage3');
      const team = (gs2.currentTeam || {}).members || [];
      const votes = gs2.currentVotes || {};
      const votedCount = Object.keys(votes).length;
      if (team.length > 0 && votedCount >= team.length) {
        const leaderUid = gs2.leaderUid;
        const isBotLeader = leaderUid && data.players && data.players[leaderUid] && data.players[leaderUid].isBot;
        if (isBotLeader) {
          setTimeout(() => finishVoting(), 500);
        }
      }
    }
    // Stage4: auto-finish mission when all team members voted
    if (data.meta && data.meta.phase === 'stage4') {
      scheduleBotVotes('stage4');
      const team = (gs2.currentTeam || {}).members || [];
      const missionVotes = gs2.missionVotes || {};
      const allVoted = team.length > 0 && team.every(uid => uid in missionVotes);
      if (allVoted) {
        const leaderUid = gs2.leaderUid;
        const isBotLeader = leaderUid && data.players && data.players[leaderUid] && data.players[leaderUid].isBot;
        if (isBotLeader) {
          setTimeout(() => finishMission(), 500);
        }
      }
    }
    // Game over: assassin bot auto-kills
    if (data.meta && data.meta.phase === 'over' && data.meta.winner === 'good') {
      const assignments = gs2.roleAssignments || {};
      const assassinUid = Object.keys(assignments).find(uid => assignments[uid] === 'assassin');
      if (assassinUid && data.players && data.players[assassinUid] && data.players[assassinUid].isBot) {
        const target = getAssassinationTarget(gs2, playersOrdered(data));
        if (target) {
          setTimeout(() => {
            db.ref('rooms/' + state.roomCode + '/gameState/assassinationTarget').set(target);
          }, 1500);
        }
      }
    }
  });
  // 在線狀態
  const presenceRef = db.ref('rooms/' + state.roomCode + '/players/' + state.uid + '/online');
  presenceRef.onDisconnect().set(false);
  presenceRef.set(true);
}
function detachRoomListener() {
  if (roomRef) {
    roomRef.off();
    roomRef = null;
  }
}

// ============================================================
// Main Render Router
// ============================================================
function render() {
  const app = document.getElementById('app');
  if (state.view === 'loading') return renderLoading(app);
  if (state.view === 'landing') return renderLanding(app);
  if (state.view === 'create') return renderCreate(app);
  if (state.view === 'join') return renderJoin(app);
  if (state.view === 'room') return renderRoom(app);
  if (!app.innerHTML) renderLanding(app);
}

// ============================================================
// Init
// ============================================================
auth.signInAnonymously().then(cred => {
  state.uid = cred.user.uid;
  state.ready = true;
  state.view = 'landing';
  render();
}).catch(err => {
  console.error('Auth error', err);
  document.getElementById('app').innerHTML = `<div class="p-6 text-center text-rose-600">登入失敗：${err.message}</div>`;
});
</script>
